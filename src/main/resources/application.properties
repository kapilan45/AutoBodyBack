spring.application.name=autobody-back

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autobody}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.servlet.multipart.max-file-size=${AUTOBODY_IMAGE_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${AUTOBODY_IMAGE_MAX_SIZE:5MB}
autobody.images.max-bytes=${AUTOBODY_IMAGE_MAX_BYTES:5242880}
autobody.jwt.secret=${AUTOBODY_JWT_SECRET}
autobody.jwt.expiration=${AUTOBODY_JWT_EXPIRATION:PT1H}
autobody.cors.allowed-origins=${AUTOBODY_CORS_ALLOWED_ORIGINS:}
